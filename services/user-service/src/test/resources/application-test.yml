spring:
  cloud:
    config:
      enabled: false
  eureka:
    client:
      enabled: false
      register-with-eureka: false
      fetch-registry: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

application:
  security:
    jwt:
      secret-key: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMTIz
      expiration: 86400000
